<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 GitHub 페이지</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
    }

    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(79, 70, 229, 0.12);
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1.1;
    }

    p {
      margin: 0 0 28px;
      color: #6b7280;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      color: white;
      font-weight: 700;
      text-decoration: none;
      background: #4f46e5;
      border-radius: 999px;
      transition: transform 0.2s, background 0.2s;
    }

    a:hover {
      background: #4338ca;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main>
    <h1>안녕하세요! 👋</h1>
    <p>나의 첫 GitHub Pages 웹사이트입니다.<br>앞으로 이곳을 멋지게 채워 나갈 예정이에요.</p>
    <a href="https://github.com/fonaa8220-dev">GitHub 방문하기</a>
  </main>
</body>
</html>
